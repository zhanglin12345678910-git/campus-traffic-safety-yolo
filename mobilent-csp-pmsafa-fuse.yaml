# YOLO11 object detection model with MobileNetV4 backbone and CSP-PMSFA head

# Parameters
nc: 80 # number of classes
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# Backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, MobileNetV4ConvSmall, []]  # 0: outputs [P2, P3, P4, P5]

# Head
head:
  # 取 backbone 输出的 P5 (下采样32倍)
  - [0, 1, Select, [3]]                # 1: P5/32
  - [1, 1, SPPF, [1024, 5]]            # 2: SPPF on P5
  - [2, 2, C2PSA, [1024]]              # 3: C2PSA on SPPF

  # 取 backbone 输出的 P4 (下采样16倍)
  - [0, 1, Select, [2]]                # 4: P4/16
  # 取 backbone 输出的 P3 (下采样8倍)
  - [0, 1, Select, [1]]                # 5: P3/8
  # 取 backbone 输出的 P2 (下采样4倍)
  - [0, 1, Select, [0]]                # 6: P2/4

  # FPN自顶向下
  - [3, 1, nn.Upsample, [None, 2, "nearest"]]         # 7: upsample C2PSA(P5)
  - [[7, 4], 1, Concat, [1]]                           # 8: cat upsampled P5 + P4
  - [8, 2, CSP_PMSFA, [512, False]]                    # 9

  - [9, 1, nn.Upsample, [None, 2, "nearest"]]         # 10: upsample
  - [[10, 5], 1, Concat, [1]]                          # 11: cat upsampled + P3
  - [11, 2, CSP_PMSFA, [256, False]]                   # 12 (P3/8-small)

  # PAN自底向上
  - [12, 1, Conv, [256, 3, 2]]                         # 13: downsample
  - [[13, 9], 1, Concat, [1]]                          # 14: cat downsampled + P4
  - [14, 2, CSP_PMSFA, [512, False]]                   # 15 (P4/16-medium)

  - [15, 1, Conv, [512, 3, 2]]                         # 16: downsample
  - [[16, 3], 1, Concat, [1]]                          # 17: cat downsampled + P5
  - [17, 2, CSP_PMSFA, [1024, True]]                   # 18 (P5/32-large)

  # Detect(P2, P3, P4, P5)
  - [[6, 12, 15, 18], 1, Detect, [nc]]                 # 19